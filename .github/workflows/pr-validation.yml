name: Validation PR SPHOT

on:
  push:
    branches:
      - chatgpt/admin-trial-strategy-2026-10-07
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check Functions syntax
        run: |
          node --check functions/index.js
          node --check functions/admin_workflow.js
          node --check functions/scripts/rebuild_public_spots.js

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze
