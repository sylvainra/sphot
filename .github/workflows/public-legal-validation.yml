name: SPHOT - Validation juridique grand public

on:
  push:
    branches:
      - feature/public-legal-first-open-20261108
      - feature/bottom-menu-tooltips-20261109
    paths:
      - .github/workflows/public-legal-validation.yml
      - lib/main.dart
      - lib/map/map_page.dart
      - lib/map/public_legal_gate.dart
      - lib/services/public_legal_acceptance_service.dart
      - test/public_legal_acceptance_service_test.dart
      - test/public_legal_gate_widget_test.dart
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-validation:
    name: Analyze, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout isolated feature branch
        uses: actions/checkout@v4

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install official Flutter stable SDK
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Analyze modified Dart files
        run: |
          flutter analyze --no-pub \
            lib/main.dart \
            lib/map/map_page.dart \
            lib/map/public_legal_gate.dart \
            lib/services/public_legal_acceptance_service.dart \
            test/public_legal_acceptance_service_test.dart \
            test/public_legal_gate_widget_test.dart

      - name: Test first-opening and version changes
        if: success() || failure()
        run: |
          flutter test --no-pub \
            test/public_legal_acceptance_service_test.dart \
            test/public_legal_gate_widget_test.dart

      - name: Run all Flutter regression tests
        if: success() || failure()
        run: flutter test --no-pub

      - name: Compile Flutter Web (without deployment)
        if: success() || failure()
        run: flutter build web --release --no-pub -t lib/main.dart

      - name: Compile Flutter Android (debug APK, no deployment)
        if: success() || failure()
        run: flutter build apk --debug --no-pub -t lib/main.dart
